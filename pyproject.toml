[tool.poetry]
name = "meme-generator"
version = "0.1.14"
description = "Python package for making fun pictures"
authors = ["meetwq <meetwq@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MemeCrafters/meme-generator"
repository = "https://github.com/MemeCrafters/meme-generator"
exclude = [
    "meme_generator/memes/**/*.jpg",
    "meme_generator/memes/**/*.png",
    "meme_generator/memes/**/*.gif",
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
certifi = ">=2026.10.19"
httpx = ">=0.20.0,<1.0.0"
loguru = ">=0.6.0,<1.0.0"
pil-utils = {path = "vendor/pil_utils-0.2.2+fleet.pillow13-py3-none-any.whl"}
# Private pil-utils metadata branch validated against Pillow 13.
Pillow = ">=13.0.0,<14.0.0"
toml = "^0.10.2"
fastapi = ">=0.141.1,<1.0.0"
starlette = ">=1.6.0,<2.0.0"
uvicorn = ">=0.52.4,<1.0.0"
python-multipart = ">=0.0.32,<0.1.0"
filetype = "^1.2.0"
rich = ">=13.0.0,<15.0.0"
dateparser = "^1.2.0"
qrcode = "^8.0"
typing-extensions = ">=4.4.0,<5.0.0"
arclet-alconna = "^1.8.23,!=1.8.27"
arclet-alconna-tools = "^0.7.9"
skia-python = "144.0.post2"

# Required by the deployed custom meme plugins.
scipy = ">=1.15.0,<2.0.0"
fonttools = ">=4.60.0,<5.0.0"
pycairo = ">=1.27.0,<2.0.0"
h11 = ">=0.16.0,<1.0.0"
pydantic = ">=2.11.9,<3.0.0"

[tool.poetry.group.dev.dependencies]

[tool.poetry.scripts]
meme = "meme_generator.cli:main"

[tool.pyright]
pythonVersion = "3.9"
pythonPlatform = "All"
typeCheckingMode = "basic"
defineConstant = { PYDANTIC_V2 = true }

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q", "I"]
ignore = ["E402", "E501", "E711", "C901", "UP037"]

[tool.ruff.lint.isort]
detect-same-package = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Exact tested deployment versions; keep Poetry and the runtime lock consistent.
[tool.poetry.group.deployment.dependencies]
"annotated-doc" = "0.0.5"
"annotated-types" = "0.8.0"
"anyio" = "4.15.1"
"arclet-alconna" = "1.8.44"
"arclet-alconna-tools" = "0.7.12"
"bbcode" = "1.1.0"
"certifi" = "2026.10.19"
"click" = "8.5.0"
"dateparser" = "1.4.3"
"fastapi" = "0.141.1"
"filetype" = "1.2.0"
"fonttools" = "4.64.0"
"h11" = "0.16.0"
"httpcore" = "1.0.9"
"httpx" = "0.28.1"
"idna" = "3.19"
"loguru" = "0.7.3"
"markdown-it-py" = "4.2.0"
"mdurl" = "0.1.2"
"nepattern" = "0.7.8"
"numpy" = "2.5.3"
"opencv-python-headless" = "4.14.0.94"
"pillow" = "13.0.0"
"pybind11" = "3.1.0"
"pycairo" = "1.29.1"
"pydantic" = "2.13.5"
"pydantic_core" = "2.46.5"
"Pygments" = "2.21.0"
"python-dateutil" = "2.9.0.post0"
"python-multipart" = "0.0.32"
"pytz" = "2026.3.post1"
"qrcode" = "8.2"
"regex" = "2026.9.3"
"rich" = "14.3.4"
"scipy" = "1.18.1"
"six" = "1.17.0"
"skia-python" = "144.0.post2"
"starlette" = "1.6.0"
"tarina" = "0.7.5"
"toml" = "0.10.2"
"typing-inspection" = "0.4.4"
"typing_extensions" = "4.16.0"
"tzlocal" = "5.4.4"
"uvicorn" = "0.52.4"
